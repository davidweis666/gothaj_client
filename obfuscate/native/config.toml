# The path of the to obfuscate jar
input = "output.jar"
# The target path for the output jar
output = "output-native.jar"
# The folder which contains all libraries your program might reference
# update: if i specify the libs shi just fails so :idk:
libraries = "libraries"
# The class file path to use for the loader class
loader = "io/github/kawase"
# The jvm platform to transpile for
# Available are:
#   - hotspot (recommended)
#   - std_java
#   - android
platform = "hotspot"
# Whether to use annotations to filter classes or not
annotations = true
# Deletes the working directory if enabled
delete_temp_dir = true

# Zig compiler settings
[zig]
# The path to the executable of the compiler
# /opt/zig/zig
executable = "zig"
# The amount of threads to use
threads = 32
# The targets to compile the transpiled code for
# Available are:
#   - windows_x86
#   - linux_x86
#   - macos_x86
#   - macos_aarch64
targets = [
    "windows_x86",
]
vmp_sdk = "VMP_SDK"
enable_vmp = true
global_vmp_level = "NONE"

run_vmp_after = true
vmp_executable = "C:\\Program Files\\VMProtect Ultimate\\VMProtect_Con.exe"

[zig.vmp_projects]
windows_x86 = "config.vmp"